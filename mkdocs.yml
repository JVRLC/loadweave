site_name: LoadWeave
site_description: Open-source Python ETL pipelines

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Accueil: index.md
  - Démarrage: getting-started.md
  - Loaders:
    - Business (Odoo): loaders/business.md
    - Stock (Odoo): loaders/stock.md
    - Plan Commercial: loaders/plan-commercial.md
    - Physico-Chimique: loaders/physico-chimique.md
    - Métabarcoding: loaders/metabarcoding.md
    - Météo: loaders/weather.md
    - Sample Results (CQ): loaders/sample-results.md
  - Référence:
    - Commandes Make: reference/commands.md
    - Power BI Invoicing Tracking: powerbi_invoicing_views.md
