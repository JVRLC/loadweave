  sample-results-loader:
    build:
      context: .
    container_name: sample-results-loader
    env_file:
      - .env.example
      - .env
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
      - ./loader-entrypoint.sh:/loader-entrypoint.sh
    entrypoint: [ "sh", "/loader-entrypoint.sh" ]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOADER_MODULE=loaders.sharepoint_loader.sample_results_loader.main
    depends_on:
      - db
    profiles:
      - sample-results

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: db
    ports:
      - "5433:5432"
