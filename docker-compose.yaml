      - ./logs:/app/logs
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
      - ./loader-entrypoint.sh:/loader-entrypoint.sh
    entrypoint: [ "sh", "/loader-entrypoint.sh" ]
