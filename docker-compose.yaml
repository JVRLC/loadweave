  pc-loader:
    build:
      context: .
    mem_limit: 2g
    env_file:
      - .env.example
      - .env
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
      - ./loader-entrypoint.sh:/loader-entrypoint.sh
    entrypoint: [ "sh", "/loader-entrypoint.sh" ]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOADER_MODULE=loaders.pc_loader.main
      - PC_PROVIDER  # picked up from shell: PC_PROVIDER=aurea|bdd_pc
    depends_on:
      - db
    profiles:
