services:
  weather-history-loader:
    build:
      context: .
    env_file:
      - .env.example
      - .env
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
      - ./loader-entrypoint.sh:/loader-entrypoint.sh
    entrypoint: [ "sh", "/loader-entrypoint.sh" ]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOADER_MODULE=loaders.weather_loader.history.main
    depends_on:
      - db
    profiles:
      - weather-history

  weather-daily-loader:
    build:
      context: .
    env_file:
      - .env.example
      - .env
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
      - ./loader-entrypoint.sh:/loader-entrypoint.sh
    entrypoint: [ "sh", "/loader-entrypoint.sh" ]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOADER_MODULE=loaders.weather_loader.daily.main
    depends_on:
      - db
    profiles:
      - weather-daily

  business-loader:
    build:
      context: .
