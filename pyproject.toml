[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loadweave"
version = "0.2.0"
description = "A small, composable ETL runner for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "LoadWeave contributors"}]
keywords = ["etl", "data-pipeline", "data-engineering", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
loadweave = "loadweave.cli:main"

[project.urls]
Repository = "https://github.com/JVRLC/loadweave"
Issues = "https://github.com/JVRLC/loadweave/issues"

[tool.setuptools.packages.find]
include = ["loadweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["loadweave"]

[tool.coverage.run]
branch = true
source = ["loadweave"]
omit = ["loadweave/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
